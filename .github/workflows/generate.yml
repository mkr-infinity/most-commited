name: Generate Commits

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of commits to generate"
        required: true
        default: "1000"
        type: string
      signed:
        description: "Sign commits with GPG"
        required: false
        default: "false"
        type: boolean
      push:
        description: "Push to GitHub after"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "mohammadkaifraja"
          git config user.email "mohammadkaifraja2@gmail.com"
          git config core.quotepath false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install rich

      - name: Generate commits
        run: |
          ARGS="--count ${{ github.event.inputs.count }}"
          if [ "${{ github.event.inputs.signed }}" = "true" ]; then
            ARGS="$ARGS --signed"
          fi
          if [ "${{ github.event.inputs.push }}" = "true" ]; then
            ARGS="$ARGS --push"
          fi
          python3 bulk-commit-generator.py $ARGS

      - name: Push commits
        if: github.event.inputs.push == 'true'
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin "${{ github.ref_name }}"

      - name: Summary
        run: |
          TOTAL=$(git rev-list --count HEAD)
          echo "## 📊 Commit Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commits Generated** | ${{ github.event.inputs.count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Commits** | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run** | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
