name: Generate Commits

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of commits to generate"
        required: true
        default: "1000"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config core.quotepath false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install rich

      - name: Generate commits
        run: |
          python3 bulk-commit-generator.py --count ${{ github.event.inputs.count }} --name "${{ secrets.GIT_USER_NAME }}" --email "${{ secrets.GIT_USER_EMAIL }}"

      - name: Push to GitHub
        run: git push origin main
