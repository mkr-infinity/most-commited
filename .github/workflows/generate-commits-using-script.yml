name: Generate Commits Using Script

on:
  schedule:
    - cron: '30 9 * * *'   # 09:30 UTC = 15:00 IST, daily
  workflow_dispatch:
    inputs:
      count:
        description: Number of commits to generate
        required: true
        default: "101"
        type: string
      folder:
        description: Target folder for activity.log
        required: true
        default: src
        type: string
      mode:
        description: Commit signing mode
        required: true
        default: unsigned
        type: choice
        options: [unsigned, signed]
      push:
        description: Push generated commits back to the selected branch
        required: true
        default: true
        type: boolean
      quiet:
        description: Reduce workflow logs for faster large runs
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: commit-generator     # never let two runs race on the same branch
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo (shallow — only the latest commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1          # ← was 0: this alone stops the 8-min hang
          show-progress: false

      - name: Configure git
        env:
          GIT_USER_NAME:  ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          if [[ -z "$GIT_USER_NAME" || -z "$GIT_USER_EMAIL" ]]; then
            echo "Missing required secrets: GIT_USER_NAME and GIT_USER_EMAIL" >&2
            exit 1
          fi
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git config core.quotepath false

      - name: Install rich
        run: python3 -m pip install --quiet --disable-pip-version-check rich

      - name: Generate commits using script
        env:
          COUNT:  ${{ inputs.count  || '101' }}
          FOLDER: ${{ inputs.folder || 'src' }}
          MODE:   ${{ inputs.mode   || 'unsigned' }}
          QUIET:  ${{ inputs.quiet }}
        run: |
          if ! [[ "$COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "count must be a positive integer" >&2
            exit 1
          fi
          if [[ "$FOLDER" == *..* ]]; then
            echo "folder must stay inside the repository" >&2
            exit 1
          fi

          ARGS=(
            --count "$COUNT"
            --folder "$FOLDER"
            --mode "$MODE"
            --yes
            --ci
            --no-banner
            --no-push
          )
          [[ "$QUIET" == "true" ]] && ARGS+=(--quiet)

          python3 bulk-commit-generator.py "${ARGS[@]}"

      - name: Push to GitHub
        if: ${{ inputs.push != false }}
        run: git push --atomic origin "HEAD:${{ github.ref_name }}"
