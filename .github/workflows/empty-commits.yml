name: Empty Commits

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of commits"
        required: true
        default: "100"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"

      - name: Generate empty commits
        run: |
          COUNT=${{ github.event.inputs.count }}
          TREE=$(git rev-parse HEAD^{tree})
          PARENT=$(git rev-parse HEAD)
          EMOJIS=(🎉 ✨ 🚀 💥 🌟 ⭐ 💫 ⚡ 🔥 💪 🎯 🏆 👑 💎 🔮
                  🌈 🎨 🛠️ 🔧 📦 📈 💡 🔍 🎭 🎪 🎯 🎱 🏓 🥊 🎣
                  🌍 🌋 🏔️ 🌴 🌲 🌸 🌺 🐉 🦅 🦋 🐋 🦈 🦚 🦩 🐲
                  🍀 🎋 🌾 🍃 🍂 🍁 🌿 🎵 🎶 🎺 🎸 🎹 🎻 🥁 🎬
                  ♟️ 🎲 🎳 🎧 🎤 🧩 💠 🔷 🔶 🔴 🟠 🟡 🟢 🔵 🟣)
          MESSAGES=(update refine polish tweak improve enhance adjust
                    optimize revise refresh bump sync increment progress
                    step iteration cycle phase forward momentum grind
                    onwards steady push next keep going)
          EMOJI_COUNT=${#EMOJIS[@]}
          MSG_COUNT=${#MESSAGES[@]}

          for ((i=1; i<=COUNT; i++)); do
            EMOJI=${EMOJIS[$((RANDOM % EMOJI_COUNT))]}
            MSG=${MESSAGES[$((RANDOM % MSG_COUNT))]}
            COMMIT=$(echo "$EMOJI commit #$i: $MSG" | git commit-tree "$TREE" -p "$PARENT")
            PARENT=$COMMIT
          done

          git update-ref HEAD "$PARENT"
